<style>
/*
VOICE  현장용. 라이더가 한 손으로 보고 바로 판단하는 지도

:root{--red:#e5161b;--ink:#111;--panel:#fff;--sub:#555}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 'Noto Sans KR',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0}
.top{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:10;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.card{pointer-events:auto;background:var(--panel);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:12px 14px}
.title b{display:block;font-weight:900;font-size:19px;letter-spacing:-.02em}
.title b i{font-style:normal;color:var(--red)}
.title span{font-size:12.5px;color:var(--sub)}
.status{margin-left:auto;font-weight:700;font-size:14px;display:none;white-space:nowrap}
.status.in{display:block;background:#0b8a4a;color:#fff}
.status.out{display:block;background:var(--red);color:#fff}
.btns{position:fixed;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;display:flex;flex-direction:column;gap:8px}
.btns button{min-width:44px;height:44px;border:0;border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);font:700 14px 'Noto Sans KR',sans-serif;padding:0 14px;cursor:pointer;color:var(--ink)}
.btns button.on{background:var(--ink);color:#fff}
.btns button:focus-visible{outline:3px solid var(--red)}
.legend{position:fixed;left:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;max-width:min(330px,calc(100vw - 150px));font-size:12.5px}
.legend summary{font-weight:700;cursor:pointer;list-style:none}
.legend summary::after{content:' ▾';color:var(--sub)}
.legend p{margin-top:6px;color:var(--sub)}
.legend em{font-style:normal;color:var(--ink);font-weight:700}
.dong{font:700 12px 'Noto Sans KR',sans-serif;color:#b3080c;background:rgba(255,255,255,.85);border:1px solid rgba(229,22,27,.35);padding:2px 7px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-50%)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25);transform:translate(-50%,-50%)}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#f4f4f4;z-index:20;text-align:center}
#err div{max-width:420px}#err b{display:block;font-size:18px;margin-bottom:8px}
@media(max-width:480px){.title b{font-size:17px}.btns button{font-size:13px}}
</style>

<script>
{
  const showErr = msg => { document.getElementById('errMsg').textContent = msg; document.getElementById('err').style.display = 'grid'; };
  window.navermap_authFailure = () => showErr('네이버 지도 인증에 실패했어요. 키와 등록된 사이트 주소(Web 서비스 URL)를 확인해 주세요.');

  // 점이 다각형 안에 있는지 (ray casting)
  const inside = (lat, lng, ring) => {
    let c = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [yi, xi] = ring[i], [yj, xj] = ring[j];
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  const area = r => r.reduce((s, p, i) => { const q = r[(i + 1) % r.length]; return s + p[1] * q[0] - q[1] * p[0]; }, 0);

  window.initMap = () => {
    const N = naver.maps, LL = (a) => new N.LatLng(a[0], a[1]);
    const lats = ZONE.zone.map(p => p[0]), lngs = ZONE.zone.map(p => p[1]);
    const bounds = new N.LatLngBounds(new N.LatLng(Math.min(...lats), Math.min(...lngs)), new N.LatLng(Math.max(...lats), Math.max(...lngs)));

    const map = new N.Map('map', {
      center: bounds.getCenter(), zoom: 13, minZoom: 11,
      zoomControl: true, zoomControlOptions: { position: N.Position.RIGHT_CENTER, style: N.ZoomControlStyle.SMALL },
      scaleControl: true, mapDataControl: false, logoControlOptions: { position: N.Position.BOTTOM_LEFT }
    });
    const fit = () => map.fitBounds(bounds, { top: 110, right: 70, bottom: 90, left: 20 });
    fit();

    // 구역 밖 어둡게 (바깥 사각형 + 구역 구멍)
    const outer = [[37.30, 126.60], [37.30, 127.40], [37.80, 127.40], [37.80, 126.60]];
    let hole = ZONE.zone.slice();
    if (Math.sign(area(outer)) === Math.sign(area(hole))) hole.reverse();
    new N.Polygon({ map, paths: [outer.map(LL), hole.map(LL)], fillColor: '#000', fillOpacity: 0.28, strokeWeight: 0, clickable: false });

    // 빨간 테두리
    new N.Polygon({ map, paths: [ZONE.zone.map(LL)], strokeColor: '#e5161b', strokeWeight: 4, strokeOpacity: 1, fillColor: '#e5161b', fillOpacity: 0.04, clickable: false });

    // 동 경계 + 동 이름
    const dongLines = [], dongLabels = [];
    ZONE.dongs.forEach(d => {
      d.rings.forEach(r => dongLines.push(new N.Polyline({ map, path: r.map(LL), strokeColor: '#e5161b', strokeWeight: 1.5, strokeOpacity: 0.55, strokeStyle: 'shortdash', clickable: false })));
      dongLabels.push(new N.Marker({ position: LL(d.label), map, clickable: false, zIndex: 50,
        icon: { content: '<div class="dong">' + d.name + '</div>', anchor: new N.Point(0, 0) } }));
    });
    let showDong = true;
    const syncDong = () => {
      const lab = showDong && map.getZoom() <= 16;
      dongLines.forEach(l => l.setMap(showDong ? map : null));
      dongLabels.forEach(m => m.setMap(lab ? map : null));
    };
    N.Event.addListener(map, 'zoom_changed', syncDong);

    // 내 위치
    const st = document.getElementById('status');
    let me = null, watchId = null, firstFix = true;
    const onPos = p => {
      const lat = p.coords.latitude, lng = p.coords.longitude, pos = new N.LatLng(lat, lng);
      if (!me) me = new N.Marker({ position: pos, map, zIndex: 100, icon: { content: '<div class="me"></div>', anchor: new N.Point(0, 0) } });
      else me.setPosition(pos);
      const ok = inside(lat, lng, ZONE.zone);
      st.className = 'card status ' + (ok ? 'in' : 'out');
      st.textContent = ok ? '구역 안' : '구역 밖';
      if (firstFix) { map.setCenter(pos); map.setZoom(16); firstFix = false; }
    };
    const bMe = document.getElementById('bMe');
    bMe.addEventListener('click', () => {
      if (!navigator.geolocation) { st.className = 'card status out'; st.textContent = '위치 사용 불가'; return; }
      if (watchId !== null && me) { map.setCenter(me.getPosition()); map.setZoom(16); return; }
      firstFix = true; bMe.classList.add('on');
      watchId = navigator.geolocation.watchPosition(onPos, () => {
        bMe.classList.remove('on'); watchId = null;
        st.className = 'card status out'; st.textContent = '위치 권한 필요';
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    });
    document.getElementById('bAll').addEventListener('click', fit);
    const bDong = document.getElementById('bDong');
    bDong.addEventListener('click', () => { showDong = !showDong; bDong.classList.toggle('on', showDong); syncDong(); });
    if (window.innerWidth < 600) document.getElementById('legend').open = false; else document.getElementById('legend').open = true;
  };

  if (!NCP_KEY_ID || NCP_KEY_ID.indexOf('__') === 0) {
    showErr('index.html 안의 NCP_KEY_ID 에 네이버 클라우드 Maps 키를 넣어주세요.');
  } else {
    const s = document.createElement('script');
    s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NCP_KEY_ID) + '&callback=initMap';
    s.onerror = () => showErr('네이버 지도 스크립트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    document.head.appendChild(s);
  }
}
