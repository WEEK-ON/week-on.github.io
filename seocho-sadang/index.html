    let me = null, watchId = null, firstFix = true;
    const onPos = p => {
      const lat = p.coords.latitude, lng = p.coords.longitude, pos = new N.LatLng(lat, lng);
      if (!me) me = new N.Marker({ position: pos, map, zIndex: 100, icon: { content: '<div class="me"></div>', anchor: new N.Point(0, 0) } });
      else me.setPosition(pos);
      const ok = inside(lat, lng, ZONE.zone);
      st.className = 'card status ' + (ok ? 'in' : 'out');
      st.textContent = ok ? '구역 안' : '구역 밖';
      if (firstFix) { map.setCenter(pos); map.setZoom(16); firstFix = false; }
    };
    const bMe = document.getElementById('bMe');
    bMe.addEventListener('click', () => {
      if (!navigator.geolocation) { st.className = 'card status out'; st.textContent = '위치 사용 불가'; return; }
      if (watchId !== null && me) { map.setCenter(me.getPosition()); map.setZoom(16); return; }
      firstFix = true; bMe.classList.add('on');
      watchId = navigator.geolocation.watchPosition(onPos, () => {
        bMe.classList.remove('on'); watchId = null;
        st.className = 'card status out'; st.textContent = '위치 권한 필요';
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    });
    document.getElementById('bAll').addEventListener('click', fit);
    const bDong = document.getElementById('bDong');
    bDong.addEventListener('click', () => { showDong = !showDong; bDong.classList.toggle('on', showDong); syncDong(); });
    if (window.innerWidth < 600) document.getElementById('legend').open = false; else document.getElementById('legend').open = true;
  };

  if (!NCP_KEY_ID || NCP_KEY_ID.indexOf('__') === 0) {
    showErr('index.html 안의 NCP_KEY_ID 에 네이버 클라우드 Maps 키를 넣어주세요.');
  } else {
    const s = document.createElement('script');
    s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NCP_KEY_ID) + '';
    s.onload = () => { let n = 0; const wait = () => (window.naver && naver.maps && naver.maps.Map) ? initMap() : (++n < 100 ? setTimeout(wait, 50) : showErr('네이버 지도를 불러오지 못했어요.')); wait(); };
    s.onerror = () => showErr('네이버 지도 스크립트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    document.head.appendChild(s);
  }
}
</script>
</body>
</html>
